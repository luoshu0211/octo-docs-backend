            The edited bento/slides JSON; preserve document identity and stable slide/element IDs. Text elements
            use html; code elements use content (never code), grammarName (js/ts/py), fontSize, align, valign and
            lineHeight. Read back the actual rendered fields.
          additionalProperties: true
    DocsPptEditResponse:
