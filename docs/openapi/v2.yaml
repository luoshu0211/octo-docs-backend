        count:
          type: integer
          minimum: 1
          maximum: 99
          description: number of blank columns to insert; resulting columnCount must remain at most 100
    DocsSheetColumnsInsertResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            doc_id:
              type: string
            logical_id:
              type: string
            after_column:
              type: integer
            inserted_columns:
              type: integer
            column_count:
              type: integer
