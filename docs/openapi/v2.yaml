          properties:
            doc_id:
              type: string
            elements:
              type: array
              items:
                type: object
                additionalProperties: true
              description: >-
                the live Excalidraw elements in fractional-index (z-order); each element is a whiteboard-schema
                node
            files:
              type: object
              description: map of fileId -> file ref (e.g. {attachId}) for images/files referenced by the scene
              additionalProperties: true
            app_state:
              type: object
              description: live Excalidraw application state, including portable board appearance fields
              additionalProperties: true
            base_version:
              type: string
              description: opaque base64 base-version token; pass to `docs scene edit --base-version`
            schema_version:
              type: integer
