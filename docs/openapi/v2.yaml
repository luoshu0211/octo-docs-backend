              items:
                type: string
            x:
              type: number
              minimum: 0
              maximum: 1
            'y':
              type: number
              minimum: 0
              maximum: 1
          description: >-
            PPT anchor contract. The CLI checks required fields and enums; coordinate bounds, identifiers,
            version/revision values and unknown fields are validated by the backend.
        point:
          type: string
          maxLength: 128
          description: Whiteboard point in X,Y coordinates.
