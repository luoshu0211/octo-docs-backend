            {"type":"insert","at":{"path":[i,...],"position":"before|after|inside_start|inside_end"},"content":[<ProseMirror
            block nodes>],"expect":{"type":"<nodeType>"}?}; replace
            {"type":"replace","range":{"from":{"path":[...]},"to":{"path":[...]}},"content":[...],"expect":?};
