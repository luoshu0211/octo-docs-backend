          type: integer
          description: 'root only: disambiguate anchorText by picking the Nth match (1-based) among the remaining matches'
        anchor:
          type: object
          additionalProperties: false
          required:
            - kind
          properties:
            kind:
              type: string
              enum:
                - document
                - slide
                - element
                - point
            slide_id:
              type: string
              minLength: 1
              maxLength: 128
            version_seq:
              type:
