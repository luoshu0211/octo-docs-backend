components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    VALIDATION_ERROR:
      description: VALIDATION_ERROR. One or more request values are invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AUTH_REQUIRED:
      description: AUTH_REQUIRED. A valid unified Token is required.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    FORBIDDEN:
      description: FORBIDDEN. The action or resource role is insufficient.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NOT_FOUND:
      description: NOT_FOUND. The resource does not exist or is not visible in the Token's Space.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CONFLICT:
      description: CONFLICT. The request conflicts with the current resource state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PAYLOAD_TOO_LARGE:
      description: PAYLOAD_TOO_LARGE. The request or result exceeds the operation limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UNSUPPORTED_MEDIA_TYPE:
      description: UNSUPPORTED_MEDIA_TYPE. Use a media type declared for this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RATE_LIMITED:
      description: RATE_LIMITED. The service rate limit was reached.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    INTERNAL_ERROR:
      description: INTERNAL_ERROR. The service could not complete the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UPSTREAM_UNAVAILABLE:
      description: UPSTREAM_UNAVAILABLE. A required upstream service is unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: VALIDATION_ERROR. The supplied parameters are invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AuthenticationRequired:
      description: AUTH_REQUIRED. The bearer token is missing, invalid or expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: FORBIDDEN. The action or resource permission was denied.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: NOT_FOUND. The resource is absent from the token's Space.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: RATE_LIMITED. Retry after the request rate drops.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: INTERNAL_ERROR. The service could not finish the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UpstreamUnavailable:
      description: UPSTREAM_UNAVAILABLE. A required service could not verify access.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Archived:
      description: CONFLICT. The document is archived.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    DocsMetadataRequest:
      type: object
      required:
        - doc_ids
      properties:
        doc_ids:
          type: array
          maxItems: 500
          items:
            type: string
    DocsMetadataResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                type: object
                required:
                  - doc_id
                  - created_by
                  - updated_by
                  - updated_at
                properties:
                  doc_id:
                    type: string
                  created_by:
                    type: string
                  updated_by:
                    type: string
                  updated_at:
                    type: string
                    format: date-time
    DocsImportDocxResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            doc_id:
              type: string
            base_version:
              type: string
            bytes:
              type: integer
            new_doc_version_seq:
              type: integer
            warnings:
              type: array
              items:
                type: string
          required:
            - base_version
      required:
        - data
    DocsImportMarkdownResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            doc_id:
              type: string
            base_version:
              type: string
            bytes:
              type: integer
            new_doc_version_seq:
              type: integer
            warnings:
              type: array
              items:
                type: string
          required:
            - base_version
      required:
        - data
    DocsImportXlsxResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            base_version:
              type: string
            warnings:
              type: array
              items:
                type: string
          required:
            - base_version
      required:
        - data
    DocsImportExcalidrawResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            doc_id:
              type: string
            base_version:
              type: string
            bytes:
              type: integer
            new_doc_version_seq:
              type: integer
            mode:
              type: string
              enum:
                - merge
                - replace
            imported_elements:
              type: integer
            imported_files:
              type: integer
            element_id_map:
              type: object
              additionalProperties:
                type: string
            file_id_map:
              type: object
              additionalProperties:
                type: string
          required:
            - base_version
      required:
        - data
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - AUTH_REQUIRED
                - FORBIDDEN
                - NOT_FOUND
                - CONFLICT
                - VALIDATION_ERROR
                - PAYLOAD_TOO_LARGE
                - RATE_LIMITED
                - INTERNAL_ERROR
                - UPSTREAM_UNAVAILABLE
            message:
              type: string
    OffsetPagination:
      type: object
      required:
        - total
        - page
        - page_size
      properties:
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
          maximum: 2147483647
        page_size:
          type: integer
          minimum: 1
          maximum: 100
    CursorPagination:
      type: object
      properties:
        has_more:
          type: boolean
        next_cursor:
          type: string
          description: Opaque cursor for the next page, omitted when has_more is false.
      required:
        - has_more
    Comment:
      type: object
      properties:
        comment_id:
          type: integer
        doc_id:
          type: string
        parent_id:
          type:
            - integer
            - 'null'
        author_id:
          type: string
        author_space_id:
          type: string
        body:
          type: string
        revision:
          type: integer
        anchor:
          type:
            - object
            - 'null'
          additionalProperties: true
        anchor_start:
          type:
            - string
            - 'null'
        anchor_end:
          type:
            - string
            - 'null'
        anchor_text:
          type: string
        resolved:
          type: boolean
        deleted:
          type: boolean
        resolved_by:
          type:
            - string
            - 'null'
        resolved_at:
          type:
            - string
            - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        replies:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
    Version:
      type: object
      properties:
        doc_version_seq:
          type: integer
        kind:
          type: integer
        label:
          type: string
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        size_bytes:
          type: integer
        schema_version:
          type: integer
        restored_from:
          type:
            - integer
            - 'null'
    DocsCreateRequest:
      type: object
      properties:
        title:
          type: string
          description: initial title (optional; defaults to empty)
        folder_id:
          type: string
          description: target folder id (optional; defaults to the space default folder)
          x-octo-flag: folderId
        doc_type:
          type: string
          description: document type (optional; defaults to 'doc')
          x-octo-flag: docType
        template_id:
          type: string
          x-octo-enum-hint: >-
            The CLI retires pitch/report/lesson for new creation by product policy; existing presentations remain
            readable/editable. Deploy the matching backend catalogue before using signal/terra/orbital/picnic;
            until then only blank is compatible. A timed-out create with a retired template cannot be replayed
            through this CLI: reconcile with docs list / docs search first; do not automatically create with a new
            key. Run octo-cli skills octo-docs and read ppt.md for rollout prerequisites.
          description: >-
            PPT template: blank (server default) or signal, terra, orbital, picnic. The four gallery choices
