openapi: 3.1.0
info:
  title: OCTO Docs CLI API
  version: 2.0.0
  description: >-
    Operations scoped to the unified token user and Space. Configure OCTO_AUTH_SERVER_URL and
    OCTO_AUTH_SERVICE_SECRET to enable the CLI routes.
servers:
  - url: /
    description: Docs service origin. The gateway supplies its own mount prefix.
tags:
  - name: docs
    description: Document metadata.
security:
  - bearerAuth: []
paths:
  /v2/cli/docs:
    get:
      tags:
        - docs
      operationId: docs.list
      summary: List visible documents
      description: List documents owned by or accessible to the token user within its Space.
      x-octo-action: docs.documents:read
      x-octo-principal: token_user
      parameters:
        - name: folder_id
          in: query
          schema:
            type: string
        - name: owner
          in: query
          schema:
            type: string
            enum:
              - me
        - name: q
          in: query
          schema:
            type: string
        - name: type
          in: query
          description: Repeat this parameter to include multiple document types.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum:
                - doc
                - sheet
                - board
                - html
                - html_ppt
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - updatedAt:asc
              - updatedAt:desc
            default: updatedAt:desc
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Document metadata and pagination.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocsListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
    post:
      operationId: docs.create
      summary: Create a document or a presentation from a template
      description: >-
        Create a document in the verified caller Space. Use docType=html_ppt, title, optional templateId (blank by
        default), and Idempotency-Key for PPT. Content initialization, metadata and member grants commit
        atomically.
      x-octo-risk: write
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocsCreateRequest'
      responses:
        '201':
          description: Created document metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocsCreateResponse'
        '400':
          $ref: '#/components/responses/VALIDATION_ERROR'
        '401':
          $ref: '#/components/responses/AUTH_REQUIRED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '404':
          $ref: '#/components/responses/NOT_FOUND'
        '409':
          $ref: '#/components/responses/CONFLICT'
        '413':
          $ref: '#/components/responses/PAYLOAD_TOO_LARGE'
        '429':
          $ref: '#/components/responses/RATE_LIMITED'
        '500':
          $ref: '#/components/responses/INTERNAL_ERROR'
        '503':
          $ref: '#/components/responses/UPSTREAM_UNAVAILABLE'
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          x-octo-flag: idempotency-key
          schema:
            type: string
            minLength: 1
            maxLength: 255
          description: Required for PPT creation, comments and version writes; preserve on an uncertain retry.
      tags:
        - docs
      x-octo-principal: token_user
      x-octo-action: docs.documents:write
      x-octo-retry: never
  /v2/cli/docs/_metadata:
    post:
      tags:
        - docs
      operationId: docs.metadata.get
      summary: Read document actor metadata in a batch
      description: Return metadata for up to 500 IDs, omitting documents outside the token Space or without reader access.
      x-octo-action: docs.documents:read
      x-octo-principal: token_user
      x-octo-risk: read
      x-octo-cli-hidden: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocsMetadataRequest'
      responses:
        '200':
          description: Actor metadata for readable active documents.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocsMetadataResponse'
        '400':
          $ref: '#/components/responses/VALIDATION_ERROR'
        '401':
          $ref: '#/components/responses/AUTH_REQUIRED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '404':
          $ref: '#/components/responses/NOT_FOUND'
        '413':
          $ref: '#/components/responses/PAYLOAD_TOO_LARGE'
        '429':
          $ref: '#/components/responses/RATE_LIMITED'
        '500':
          $ref: '#/components/responses/INTERNAL_ERROR'
        '503':
          $ref: '#/components/responses/UPSTREAM_UNAVAILABLE'
  /v2/cli/docs/{doc_id}:
    get:
      tags:
        - docs
      operationId: docs.get
      summary: Get document metadata
      description: Read an active document in the token's Space with reader access or higher.
      x-octo-action: docs.documents:read
      x-octo-principal: token_user
      parameters:
        - name: doc_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Document metadata and the token user's current role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocsGetResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Archived'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
    patch:
      operationId: docs.rename
      summary: Rename a document (needs admin)
      x-octo-risk: write
      parameters:
        - name: doc_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocsRenameRequest'
      responses:
        '200':
          description: Renamed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocsRenameResponse'
        '400':
          $ref: '#/components/responses/VALIDATION_ERROR'
        '401':
          $ref: '#/components/responses/AUTH_REQUIRED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '404':
          $ref: '#/components/responses/NOT_FOUND'
        '409':
          $ref: '#/components/responses/CONFLICT'
        '413':
          $ref: '#/components/responses/PAYLOAD_TOO_LARGE'
        '429':
          $ref: '#/components/responses/RATE_LIMITED'
        '500':
          $ref: '#/components/responses/INTERNAL_ERROR'
        '503':
          $ref: '#/components/responses/UPSTREAM_UNAVAILABLE'
      tags:
        - docs
      x-octo-principal: token_user
      x-octo-action: docs.documents:write
      x-octo-retry: never
      description: An administrator can set the title of a document in the token’s Space.
    delete:
      operationId: docs.delete
      summary: Document deletion is disabled for CLI tokens
      description: >-
        After authentication the service refuses this operation with 403 FORBIDDEN and
        details.reason=cli_delete_disabled, regardless of the document's existence or the caller's role. Manage
        deletion from Octo.
      x-octo-risk: write
      parameters:
        - name: doc_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AUTH_REQUIRED'
        '403':
          description: FORBIDDEN. CLI tokens cannot delete documents.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RATE_LIMITED'
        '500':
          $ref: '#/components/responses/INTERNAL_ERROR'
        '503':
          $ref: '#/components/responses/UPSTREAM_UNAVAILABLE'
      tags:
        - docs
      x-octo-principal: token_user
      x-octo-retry: never
      x-octo-action: docs.documents:write
  /v2/cli/docs/_search:
    post:
      operationId: docs.search
      summary: Search accessible documents by full-text content
      description: >-
        Searches documents the Token user can read. Use --keyword and repeat --doc-type to filter by kind. Pass
        --page-all to collect all pages.
      x-octo-risk: read
      x-octo-pagination:
        cursorParam: cursor
        rejectCursorRepeats: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocsSearchRequest'
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocsSearchResponse'
        '400':
          $ref: '#/components/responses/VALIDATION_ERROR'
        '401':
          $ref: '#/components/responses/AUTH_REQUIRED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '404':
          $ref: '#/components/responses/NOT_FOUND'
        '413':
          $ref: '#/components/responses/PAYLOAD_TOO_LARGE'
        '429':
          $ref: '#/components/responses/RATE_LIMITED'
        '500':
          $ref: '#/components/responses/INTERNAL_ERROR'
        '503':
          $ref: '#/components/responses/UPSTREAM_UNAVAILABLE'
      tags:
        - docs
      x-octo-principal: token_user
      x-octo-action: docs.documents:read
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
            description: opaque cursor from the previous page
          description: Opaque cursor from the previous page.
        - name: page_size
          in: query
          schema:
            type: integer
          description: items per page
  /v2/cli/docs/{doc_id}/_import_docx:
    post:
      operationId: docs.import.docx
      summary: Import DOCX content
      description: Atomically replace rich text with the imported Word document.
      tags:
        - docs
      x-octo-principal: token_user
      x-octo-action: docs.content:write
      x-octo-cli-hidden: true
      x-octo-retry: never
      parameters:
        - name: doc_id
          in: path
          schema:
            type: string
          required: true
          description: Document ID.
      requestBody:
        required: true
        description: Raw file bytes.
        content:
          application/vnd.openxmlformats-officedocument.wordprocessingml.document:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Import completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocsImportDocxResponse'
        '400':
          $ref: '#/components/responses/VALIDATION_ERROR'
        '401':
          $ref: '#/components/responses/AUTH_REQUIRED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '404':
          $ref: '#/components/responses/NOT_FOUND'
        '409':
          $ref: '#/components/responses/CONFLICT'
        '413':
          $ref: '#/components/responses/PAYLOAD_TOO_LARGE'
        '415':
          $ref: '#/components/responses/UNSUPPORTED_MEDIA_TYPE'
        '429':
          $ref: '#/components/responses/RATE_LIMITED'
        '500':
          $ref: '#/components/responses/INTERNAL_ERROR'
        '503':
          $ref: '#/components/responses/UPSTREAM_UNAVAILABLE'
      x-octo-risk: write
  /v2/cli/docs/{doc_id}/_import_markdown:
    post:
      operationId: docs.import.markdown
      summary: Import MARKDOWN content
      description: Atomically replace rich text with the imported Markdown file.
      tags:
        - docs
      x-octo-principal: token_user
      x-octo-action: docs.content:write
      x-octo-cli-hidden: true
      x-octo-retry: never
      parameters:
        - name: doc_id
          in: path
          schema:
            type: string
          required: true
          description: Document ID.
      requestBody:
        required: true
        description: Raw file bytes.
        content:
          text/markdown:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Import completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocsImportMarkdownResponse'
        '400':
          $ref: '#/components/responses/VALIDATION_ERROR'
        '401':
          $ref: '#/components/responses/AUTH_REQUIRED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '404':
          $ref: '#/components/responses/NOT_FOUND'
        '409':
          $ref: '#/components/responses/CONFLICT'
        '413':
          $ref: '#/components/responses/PAYLOAD_TOO_LARGE'
        '415':
          $ref: '#/components/responses/UNSUPPORTED_MEDIA_TYPE'
        '429':
          $ref: '#/components/responses/RATE_LIMITED'
        '500':
          $ref: '#/components/responses/INTERNAL_ERROR'
        '503':
          $ref: '#/components/responses/UPSTREAM_UNAVAILABLE'
      x-octo-risk: write
  /v2/cli/docs/{doc_id}/_import_xlsx:
    post:
      operationId: docs.import.xlsx
      summary: Import XLSX content
      description: Import the first visible worksheet and replace the target sheet content.
      tags:
        - docs
      x-octo-principal: token_user
      x-octo-action: docs.content:write
      x-octo-cli-hidden: true
      x-octo-retry: never
      parameters:
        - name: doc_id
          in: path
          schema:
            type: string
          required: true
          description: Document ID.
      requestBody:
        required: true
        description: Raw file bytes.
        content:
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Import completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocsImportXlsxResponse'
        '400':
          $ref: '#/components/responses/VALIDATION_ERROR'
        '401':
          $ref: '#/components/responses/AUTH_REQUIRED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '404':
          $ref: '#/components/responses/NOT_FOUND'
        '409':
          $ref: '#/components/responses/CONFLICT'
        '413':
          $ref: '#/components/responses/PAYLOAD_TOO_LARGE'
        '415':
          $ref: '#/components/responses/UNSUPPORTED_MEDIA_TYPE'
        '429':
          $ref: '#/components/responses/RATE_LIMITED'
        '500':
          $ref: '#/components/responses/INTERNAL_ERROR'
        '503':
          $ref: '#/components/responses/UPSTREAM_UNAVAILABLE'
      x-octo-risk: write
  /v2/cli/docs/{doc_id}/_import_excalidraw:
    post:
      operationId: docs.import.excalidraw
      summary: Import EXCALIDRAW content
      description: Import a native Excalidraw file in merge or replace mode.
      tags:
        - docs
      x-octo-principal: token_user
      x-octo-action: docs.content:write
      x-octo-cli-hidden: true
      x-octo-retry: never
      parameters:
        - name: doc_id
          in: path
          schema:
            type: string
          required: true
          description: Document ID.
        - name: mode
          in: query
          schema:
            type: string
            enum:
              - merge
              - replace
            default: merge
          description: Import mode.
      requestBody:
        required: true
        description: Raw file bytes.
        content:
          application/json:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Import completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocsImportExcalidrawResponse'
        '400':
          $ref: '#/components/responses/VALIDATION_ERROR'
        '401':
          $ref: '#/components/responses/AUTH_REQUIRED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '404':
          $ref: '#/components/responses/NOT_FOUND'
        '409':
          $ref: '#/components/responses/CONFLICT'
        '413':
          $ref: '#/components/responses/PAYLOAD_TOO_LARGE'
        '415':
          $ref: '#/components/responses/UNSUPPORTED_MEDIA_TYPE'
        '429':
          $ref: '#/components/responses/RATE_LIMITED'
        '500':
          $ref: '#/components/responses/INTERNAL_ERROR'
        '503':
          $ref: '#/components/responses/UPSTREAM_UNAVAILABLE'
      x-octo-risk: write
  /v2/cli/docs/{doc_id}/_export:
    get:
      operationId: docs.file.export
      summary: Export a document or board to a file
      tags:
        - docs
      x-octo-principal: token_user
      x-octo-action: docs.content:read
      x-octo-cli-hidden: true
      x-octo-binary-response: true
      parameters:
        - name: doc_id
          in: path
          schema:
            type: string
          required: true
          description: Document ID.
        - name: format
          in: query
          schema:
            type: string
            enum:
              - md
              - docx
              - pdf
              - xlsx
              - png
              - svg
          required: true
      responses:
        '200':
          description: Exported document bytes
          headers:
            Content-Disposition:
              description: Attachment filename.
              schema:
                type: string
          content:
            text/markdown:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/svg+xml:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/VALIDATION_ERROR'
        '401':
          $ref: '#/components/responses/AUTH_REQUIRED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '404':
          $ref: '#/components/responses/NOT_FOUND'
        '413':
          $ref: '#/components/responses/PAYLOAD_TOO_LARGE'
        '429':
          $ref: '#/components/responses/RATE_LIMITED'
        '500':
          $ref: '#/components/responses/INTERNAL_ERROR'
        '503':
          $ref: '#/components/responses/UPSTREAM_UNAVAILABLE'
      x-octo-risk: read
      description: The server selects the export renderer from the format and document type.
  /v2/cli/docs/{doc_id}/content:
    get:
      operationId: docs.content.get
      summary: Read a document's live body + its base version (needs reader)
      description: >-
        Reads the LIVE ProseMirror body of a doc_type 'doc' plus the base-version token that pins the read. Pass
        that token to `docs content edit` as --base-version so the optimistic-concurrency guard can prove the body
        did not change between read and write. board / whiteboard bodies are a different Y.Doc shape and return 409
        CONFLICT (details.reason=unsupported_doc_type) here.
      x-octo-risk: read
      parameters:
        - name: doc_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Live body + base version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocsContentGetResponse'
              example:
                data:
                  doc_id: example-doc
                  base_version: example-base-version
                  schema_version: 1
                  doc:
                    type: doc
                    content:
                      - type: paragraph
        '400':
          $ref: '#/components/responses/VALIDATION_ERROR'
        '401':
          $ref: '#/components/responses/AUTH_REQUIRED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '404':
          $ref: '#/components/responses/NOT_FOUND'
        '409':
          $ref: '#/components/responses/CONFLICT'
        '429':
          $ref: '#/components/responses/RATE_LIMITED'
        '500':
          $ref: '#/components/responses/INTERNAL_ERROR'
        '503':
          $ref: '#/components/responses/UPSTREAM_UNAVAILABLE'
      tags:
        - docs
      x-octo-principal: token_user
      x-octo-action: docs.content:read
    patch:
      operationId: docs.content.edit
      summary: Apply an incremental block-op edit to a document body (needs writer)
      description: >-
        Apply a batch of block operations using If-Match and a JSON ops array. A stale version returns 409 CONFLICT
        and requires a fresh read.
      x-octo-risk: write
      parameters:
        - name: doc_id
          in: path
          required: true
          schema:
            type: string
        - name: If-Match
          in: header
          required: true
          x-octo-flag: base-version
          schema:
            type: string
          description: >-
            base-version token from 'docs content get' (sent as the If-Match header for optimistic concurrency;
            required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocsContentEditRequest'
      responses:
        '200':
          description: Edit applied; carries the new base version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocsContentEditResponse'
        '400':
          $ref: '#/components/responses/VALIDATION_ERROR'
        '401':
          $ref: '#/components/responses/AUTH_REQUIRED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '404':
          $ref: '#/components/responses/NOT_FOUND'
        '409':
          $ref: '#/components/responses/CONFLICT'
        '413':
          $ref: '#/components/responses/PAYLOAD_TOO_LARGE'
        '429':
          $ref: '#/components/responses/RATE_LIMITED'
        '500':
          $ref: '#/components/responses/INTERNAL_ERROR'
        '503':
          $ref: '#/components/responses/UPSTREAM_UNAVAILABLE'
      tags:
        - docs
      x-octo-principal: token_user
      x-octo-action: docs.content:write
      x-octo-retry: never
  /v2/cli/docs/{doc_id}/scene:
    get:
      operationId: docs.scene.get
      summary: Read a whiteboard's live scene + its base version (needs reader)
      description: >-
        Reads the LIVE Excalidraw scene of a doc_type 'board' — its `elements` in fractional-index (z-order), the
        `files` map of image/file refs, and the base-version token that pins the read. Pass that token to `docs
        scene edit` as --base-version so the optimistic-concurrency guard can prove the scene did not change
        between read and write. doc / sheet bodies are a different Y.Doc shape and return 409 CONFLICT
        (details.reason=unsupported_doc_type) here; a live scene that decodes to a wrong-kind / corrupt blob
        returns 409 CONFLICT (details.reason=board_snapshot_invalid).
      x-octo-risk: read
      parameters:
        - name: doc_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Live scene + base version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocsSceneGetResponse'
        '400':
          $ref: '#/components/responses/VALIDATION_ERROR'
        '401':
          $ref: '#/components/responses/AUTH_REQUIRED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '404':
          $ref: '#/components/responses/NOT_FOUND'
        '409':
          $ref: '#/components/responses/CONFLICT'
        '429':
