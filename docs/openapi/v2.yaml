    DocsSheetListResponse:
      type: object
      properties:
        data:
          type: object
          required:
            - doc_id
            - items
          properties:
            doc_id:
              type: string
            items:
              type: array
              items:
                type: object
                required:
                  - sheet_id
                  - name
                  - order
                  - row_count
                  - column_count
                properties:
                  sheet_id:
                    type: string
                    description: Persistent worksheet logicalId; prefer this over a mutable display name for subsequent reads.
                  name:
                    type: string
                  order:
                    type: number
                  row_count:
                    type: integer
                  column_count:
                    type: integer
      required:
        - data
    DocsSheetGetResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            doc_id:
              type: string
            sheet_id:
              type: string
              description: >-
                resolved logicalId on worksheet-scoped reads and their continuation pages; absent on whole-workbook
                reads
            sheet_cells:
              type: object
              description: >-
                flat cell map keyed `sheetId!row:col`; each value is {v?,f?,s?,p?,t?}. Rows are 0-based and may be
                0..9999; columns are 0-based and may be 0..99. A page slice in paged mode. Shrinking rowCount or
                columnCount retains cells beyond the visible boundary for undo/regrowth, so renderers and exporters
                should ignore rows >= the effective rowCount and columns >= the effective columnCount.
              additionalProperties: true
            sheet_dims:
              type: object
              description: >-
                column-width / row-height overrides in one workbook-level map. Keys `${logicalId}:c<idx>` /
                `${logicalId}:r<idx>` target a specific tab; bare `c<idx>` / `r<idx>` address the legacy default
                sheet. Reads return keys exactly as stored. Returned on the first page only in paged mode.
              additionalProperties: true
            sheet_hyperlinks:
              type: object
              description: >-
                cell hyperlinks keyed `${sheetId}!${linkId}`; each value is {id,row,column,payload,display?}.
                Returned on the first page only in paged mode.
              additionalProperties: true
            sheet_merges:
              type: object
              description: >-
                merged cell ranges keyed `${logicalId}:sr:sc:er:ec` (0-based startRow:startCol:endRow:endCol); each
                value is true. Returned on the first page only in paged mode.
              additionalProperties: true
            sheet_list:
              type: object
              description: >-
                sheet tabs / pages keyed by logicalId; each value is {name,order,rowCount?,columnCount?}. rowCount
                is 1..10000 and columnCount is 1..100. The current backend stores explicit counts when it creates a
                new sheet, defaulting to 200 rows by 20 columns (A-T); missing stored counts therefore identify a
                pre-existing legacy 1000-row by 100-column sheet. The first tab's logicalId is 'default'. Returned
                on the first page only in paged mode.
              additionalProperties: true
            sheet_freeze:
              type: object
              description: >-
                freeze panes keyed by logicalId; each value is {startRow,startColumn,xSplit,ySplit}. An unfrozen
                axis reads back with startRow/startColumn -1 even when the write used 0. Returned on the first page
                only in paged mode.
              additionalProperties: true
            sheet_filters:
              type: object
              description: >-
                shared auto-filter state keyed by logicalId; each value is {ref,filterColumns?:[{"colId":<absolute
                0-based column>,"filters":{"filters":[<raw values>]}}],enabledColumns?:[<absolute 0-based
                column>]}. ref.startRow is the header row and stays visible; criteria apply to rows below it.
                enabledColumns is non-empty when present, contains only columns inside ref, and identifies the
                exact columns with visible filter buttons; every filterColumns colId also appears in
                enabledColumns. It is deduplicated and sorted on readback. For example, ref G:M plus
                enabledColumns:[6,12] enables only G and M, not H-L. This controls filter-button visibility only,
                not read or write access. Omitted enabledColumns identifies a legacy snapshot where every column in
                ref is enabled. An empty filterColumns array is omitted on readback. Returned on the first page
                only in paged mode.
              additionalProperties: true
            sheet_data_validations:
              type: object
              description: >-
                data-validation arrays keyed by logicalId; each array can contain every returned validation family,
                including `list`, `listMultiple`, and `checkbox`. This public shape is not the internal flat
                `${logicalId}!${uid}` Y.Map. Dropdown formula1 is the serialized option list and formula2 is the
                comma-separated option-color list. Returned on the first page only in paged mode.
              additionalProperties: true
            base_version:
              type: string
              description: opaque base64 base-version token; pass to `docs sheet edit --base-version`
            sheet_conditional_formats:
              type: object
              additionalProperties:
                type: object
                additionalProperties: true
              description: >-
                Compact conditional-format rules keyed by logicalId!cfId. Each value is
                {priority,rule:{cfId,stopIfTrue,ranges,rule}}; the inner rule uses Univer highlightCell,
                colorScale, dataBar or iconSet. Never expand a rule into per-cell styles. Requires the paired
                conditional-format API backend. Returned on the first page only in paged mode.
        pagination:
          $ref: '#/components/schemas/CursorPagination'
      required:
        - data
        - pagination
    DocsSheetEditRequest:
      type: object
      properties:
        cells:
          type: object
          description: >-
            batch of cell ops keyed by cell key `sheetId!row:col` (e.g. `default!0:0`). Rows are 0-based and may be
            0..9999; columns are 0-based and may be 0..99. Each value is either
            {"v":<string|number|boolean|null>,"f":"<formula>"?,"s":<style object>?,"p":<rich-text
            object>?,"t":<number>?} to set the cell, or null to delete it. At least one of v/f/s/p/t must be
            present on a set. A non-null write at a row index >= rowCount or column index >= columnCount grows that
            sheet atomically, capped at 10000 rows and 100 columns; a write past either cap is rejected with 422
            sheet_cell_invalid. Pass via --data.
          additionalProperties: true
        dims:
          type: object
          description: >-
            batch of column-width / row-height ops in one workbook-level map. Use `${logicalId}:c<idx>` /
            `${logicalId}:r<idx>` to target a specific tab; bare `c<idx>` / `r<idx>` address the legacy default
            sheet. Bare and prefixed default-sheet keys are separate stored entries: read sheetDims first and clear
            the bare twin while migrating, for example `{"c0":null,"default:c0":200}`. Each value is a positive
            pixel number to set, or null to delete that dim. Optional. Pass via --data.
          additionalProperties: true
        drawings:
          type: object
          description: >-
            batch of floating-image ops keyed `${sheetId}!${drawingId}` (e.g. `default!img1`). Each value is a
            serialized Univer ISheetImage — {drawingId (== the key's id), drawingType:0, imageSourceType:"BASE64",
            source:"data:image/png;base64,…", transform:{left,top,width,height,angle,flipX,flipY,skewX,skewY},
            sheetTransform:{from:{column,row,columnOffset,rowOffset},to:{…}}, axisAlignSheetTransform} — or null to
            delete it. The image bytes ride inline in `source`. A MATH FORMULA is written here too, as a float-DOM
            drawing: {drawingId, drawingType:8, componentKey:"octo-math-formula", data:{latex,id,fontSize},
            transform, sheetTransform} (latex in data.latex; data.id == drawingId). Optional. Pass via --data.
          additionalProperties: true
        hyperlinks:
          type: object
          description: >-
            batch of cell-hyperlink ops keyed `${sheetId}!${linkId}` (e.g. `default!lnk1`). Each value is {id (==
            the key's linkId), row, column (0-based cell anchor), payload:"<url>" (http/https/mailto or an internal
            #jump), display?:"<label>"} to set, or null to delete. The link lives outside cell data and points at a
            cell by row/column; put the cell's visible text in that cell's `v`. Optional. Pass via --data.
          additionalProperties: true
        merges:
          type: object
          description: >-
            batch of merged-cell-range ops keyed `${logicalId}:sr:sc:er:ec` (0-based
            startRow:startCol:endRow:endCol, e.g. `default:0:0:1:2` merges the A1:C2 block). Value true to merge
            that range, or null to un-merge it. Optional. Pass via --data.
          additionalProperties: true
        sheets:
          type: object
          description: >-
            batch of sheet-TAB (page) ops keyed by logicalId. Value {name,order,rowCount?,columnCount?} to create /
            rename / reorder / resize a tab, or null to delete it; name and order are required on every non-null
            entry, and deleting a tab also removes its validation rules. rowCount is an integer 1..10000 and
            columnCount is an integer 1..100. The backend stores explicit counts for new tabs, defaulting to 200
            rows by 20 columns (A-T); pre-existing legacy tabs without stored counts remain 1000 by 100. On an
            existing tab, omitting either count preserves that dimension, but a resize payload must still resend
            name and order. Read the current tabs from `docs sheet get`'s sheetList; the first tab's logicalId is
            'default'. To ADD a sheet: set a NEW logicalId here AND write that sheet's cells with keys
            `${logicalId}!row:col`. Optional. Pass via --data.
          additionalProperties: true
        freeze:
          type: object
          description: >-
            batch of freeze-pane configs keyed by logicalId. Value {startRow,startColumn,xSplit,ySplit};
            startRow/startColumn are the first scrollable row/column and normally equal ySplit/xSplit when freezing
            the first N rows/columns. Use -1 for the start coordinate of an unfrozen axis; 0 is accepted there but
            normalizes to -1 on readback. null unfreezes that sheet. Optional. Pass via --data.
          additionalProperties: true
        filters:
          type: object
          description: >-
            batch of replace-style shared auto-filter snapshots keyed by logicalId. Value
            {ref:{startRow,startColumn,endRow,endColumn},filterColumns?:[{"colId":<absolute 0-based
            column>,"filters":{"filters":[<raw values>]}}],enabledColumns?:[<absolute 0-based column>]}.
            ref.startRow is the header row and stays visible; criteria apply to rows below it. colId is not an
            offset from ref.startColumn. Sending filterColumns:[] keeps the range but omits filterColumns on
            readback. When enabledColumns is present it must be non-empty, contain only columns inside ref, and
            select exactly which columns show filter buttons; every filterColumns colId must also appear in
            enabledColumns. A mismatch or enabledColumns:[] is rejected with 422 sheet_cell_invalid. The server
            deduplicates and sorts enabledColumns. For example, ref G:M plus enabledColumns:[6,12] enables only G
            and M, not H-L. This controls filter-button visibility only, not read or write access; use protected
            ranges for access control. Read sheetFilters first and resend the complete filter object, including
            enabledColumns, when changing criteria. Omitting enabledColumns invokes legacy all-columns-in-ref
            behavior and silently widens the visible controls. null removes the filter and all controls. Optional.
            Pass via --data.
          additionalProperties: true
        data_validations:
          type: object
          description: >-
            replace-style data-validation arrays keyed by logicalId. This public REST shape covers every validation
            family, including list, listMultiple, and checkbox; do not use the internal flat `${logicalId}!${uid}`
            Y.Map shape except when the server returns repairDataValidationKey and explicitly requests one
            deletion-only repair. The server requires each rule to have a uid unique within that sheet (1–128
            characters, no `!` or control characters) and at least one non-empty
            ranges:[{startRow,startColumn,endRow,endColumn}] entry. Checkbox ranges must not overlap another
            checkbox rule after the complete edit; list and listMultiple overlaps are accepted by the backend and
            should be sent only when intentional. It replaces that sheet's entire rule set, so read
            sheetDataValidations first and resend every rule to keep; do not write if the deployed read surface
            omits any validation family. Checkbox formula1/formula2 are optional distinct literal strings that
            default to "1"/"0", and the server normalizes allowBlank to true. For a working colored dropdown, use
            type 'list' or 'listMultiple', formula1 as a JSON string array of labels, formula2 as the same number
            of comma-separated colors, showDropDown:true, renderMode:2, and no operator. These dropdown fields are
            recommended rendering inputs, not additional server-required fields. A listMultiple cell stores
            selected labels in v as a JSON-array string; a list cell stores the label directly. The server strips
            operator from otherwise-valid list rules. null or [] removes all rules for the sheet. Optional. Pass
            via --data.
          additionalProperties: true
        conditional_formats:
          type: object
          additionalProperties:
            type:
              - object
              - 'null'
            additionalProperties: true
          description: >-
            Compact conditional-format rules keyed by logicalId!cfId. Each value is
            {priority,rule:{cfId,stopIfTrue,ranges,rule}}; the inner rule uses Univer highlightCell, colorScale,
            dataBar or iconSet. Never expand a rule into per-cell styles. Requires the paired conditional-format
            API backend. Sparse upserts: send a complete value to create/update one rule, null to delete it;
            unrelated rules survive. Read a fresh baseVersion first. Maximum 1000 rules/1 MiB per workbook and 64
            KiB per rule. Protected worksheets are checked server-side. Pass via --data.
    DocsSheetEditResponse:
      type: object
