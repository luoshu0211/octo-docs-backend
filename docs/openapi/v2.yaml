  /v2/cli/docs/{doc_id}/versions/{version_id}/state:
    get:
      operationId: docs.versions.state
      summary: Read a version's decoded content snapshot (read-only preview; needs reader)
      description: >-
        Returns the version decoded to structured content, kind-selected by the doc's doc_type. A document/sheet
        decodes to ProseMirror JSON plus the spreadsheet maps exposed by this endpoint ({kind:'document', doc,
        sheetCells, sheetDims, sheetList, sheetFreeze, sheetFilters, sheetDataValidations, schemaVersion,
        docVersionSeq}); every sheet map is an empty {} for a text document. A board decodes to an Excalidraw scene
        ({kind:'board', scene, schemaVersion, docVersionSeq}). A PPT decodes to its immutable presentation deck
        ({kind:'ppt', deck, schemaVersion, docVersionSeq}). This is a read-only preview of a past snapshot, not the
