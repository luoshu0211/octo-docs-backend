    patch:
      operationId: docs.scene.edit
      summary: Apply an element upsert/delete batch to a whiteboard scene (needs writer)
      description: >-
        Applies a batch of element upserts and soft-deletes to a doc_type 'board' scene under a mandatory
        optimistic-concurrency guard. Pass the base-version token from `docs scene get` via --base-version (sent as
        the If-Match header); the server rejects with 409 CONFLICT (base_version_stale) if the live scene moved
        since that read. `elements` are full elements to upsert (CAS: the higher `version` wins),
        `deletedElementIds` are soft-delete tombstones, and `files` upserts file refs; the batch is a structured
        object, so pass it as JSON through --data. Every element in `elements` must carry a valid fractional-index
        `index` (z-order key); the CLI rejects an index-less or malformed-index element locally before sending.
        Only doc_type 'board' is accepted (doc / sheet return 409 CONFLICT (details.reason=unsupported_doc_type)).
        Gates: element count over the max → 413 PAYLOAD_TOO_LARGE (details.reason=too_many_elements), a single
        element too large → 413 PAYLOAD_TOO_LARGE (details.reason=element_too_large), whole scene over the cap →
        413 PAYLOAD_TOO_LARGE (details.reason=doc_too_large), an element failing the whitelist → 400
        VALIDATION_ERROR (details.reason=board_element_invalid), a file ref with no usable attachId → 400
        VALIDATION_ERROR (details.reason=board_file_invalid), missing base version or malformed shape → 400
        invalid_body.
      x-octo-risk: write
      parameters:
        - name: doc_id
          in: path
          required: true
          schema:
            type: string
        - name: If-Match
          in: header
          required: true
          x-octo-flag: base-version
          schema:
            type: string
          description: >-
            base-version token from 'docs scene get' (sent as the If-Match header for optimistic concurrency;
            required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocsSceneEditRequest'
      responses:
        '200':
          description: Edit applied; carries the new base version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocsSceneEditResponse'
        '400':
          $ref: '#/components/responses/VALIDATION_ERROR'
        '401':
          $ref: '#/components/responses/AUTH_REQUIRED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '404':
          $ref: '#/components/responses/NOT_FOUND'
        '409':
          $ref: '#/components/responses/CONFLICT'
        '413':
