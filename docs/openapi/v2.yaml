    DocsSceneEditRequest:
      type: object
      properties:
        elements:
          type: array
          items:
            type: object
            additionalProperties: true
          description: >-
            full Excalidraw elements to upsert; on a key collision the element with the higher `version` (then
            smaller `versionNonce`) wins the CAS. Each element MUST carry a valid fractional-index `index` (z-order
            key produced by the fractional-indexing / Excalidraw rules, e.g. `a0`); an index-less or
            malformed-index element is rejected locally before sending. Pass via --data.
        deleted_element_ids:
          type: array
          items:
            type: string
          description: >-
            element ids to soft-delete; each becomes a tombstone with a superseding version so it converges under
            CAS. Supply with --deletedElementIds or in --data.
          x-octo-flag: deletedElementIds
        files:
          type: object
          description: >-
            map of fileId -> file ref (e.g. {"attachId":"…"}) to upsert for images/files referenced by the scene.
            Pass via --data.
          additionalProperties: true
    DocsSceneEditResponse:
      type: object
      properties:
