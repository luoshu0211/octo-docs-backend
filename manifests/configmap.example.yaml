# Example only. Do not copy this file into deploy-files; apply it manually per
# environment so emergency kubectl edits are not overwritten by ArgoCD sync.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: octo-docs-backend-config-{{BRANCH}}
  labels:
    app: octo-docs-backend
    app.kubernetes.io/name: octo-docs-backend
    app.kubernetes.io/part-of: octo-docs
    octo.docs/env: "{{BRANCH}}"
data:
  MYSQL_HOST: "<mysql-host>"
  MYSQL_PORT: "3306"
  MYSQL_USER: "octo_docs"
  MYSQL_DATABASE: "octo_docs"
  MYSQL_CONNECTION_LIMIT: "10"

  REDIS_HOST: "<redis-host>"
  REDIS_PORT: "6379"

  # PPT reuses REDIS_*, MYSQL_*, COLLAB_TOKEN_PUBLIC_WS_URL and the existing
  # OCTO_DOCS_BOT_MENTION_TOKEN / OCTO_SERVER_BASE_URL. No separate Docs-backend gate.
  # PPT comment tasks require OCTO_DOCS_BOT_MENTION_PPT_ENABLED=true on Octo Server
  # after every relevant plugin/CLI consumer is upgraded and verified (see DEPLOYMENT.md).

  COLLAB_TOKEN_TTL_SECONDS: "300"
  # Strict by default. A rollout-specific legacy override must be an explicit,
  # temporary operator decision and cannot bypass current-Space proof.
  COLLAB_ALLOW_LEGACY_TOKENS_WITHOUT_HOME_SPACE_PROOF: "false"
  # Shared Web gateway: /docs-collab -> Hocuspocus 1234;
  # /api/v1/ppt/collab -> Docs HTTP 3000. Direct-port/separate-origin deployments
  # must explicitly set PPT_RELAY_PUBLIC_WS_URL to the public PPT endpoint.
  COLLAB_TOKEN_PUBLIC_WS_URL: "wss://<web-host>/docs-collab"

  OCTO_IDENTITY_MODE: "http"
  OCTO_SERVER_BASE_URL: "http://octo-server-{{BRANCH}}:8080"
  # Secret (not ConfigMap data): OCTO_SERVER_TOKEN is optional. Human member
  # directory lookups prefer it when configured and otherwise use the caller's
  # session token. Bot PUT defaults an omitted principalSpaceId to the Bot bearer
  # Space and validates there with that bearer. An explicitly selected other Space
  # gets no current directory revalidation and is existing-row/update-only. Bot
  # DELETE is exact and directory-free; Human DELETE follows the service-token-
  # first policy for its creator-owned-Bot cascade.

  # Drive-library-derived viewer access (TES-131 / docs!129). Third, supplementary
  # read-permission source: an effective member of a drive library that has a doc
  # mounted derives a READER grant even with no doc_member row / share. Master
  # switch default false => no drive lookup, effective role unchanged. Requires the
  # drive side to expose POST /internal/v1/docs/derived-access. Auth uses independent
  # inbound/outbound tokens (see DOCS_INTERNAL_TOKEN / DRIVE_INTERNAL_TOKEN below);
  # the outbound token must equal drive's internal_token, but the inbound token is
  # docs-side authoritative and independent. Fail-closed on any drive error.
  # See docs/DEPLOYMENT.md §3.1.2.
  DRIVE_DERIVED_ENABLED: "false"
  # Base URL of the drive internal service; docs POSTs to
  # <base>/internal/v1/docs/derived-access. Empty => the lookup is a no-op even
  # when enabled, so a half-configured deploy fails closed instead of erroring on
  # every read. In-network only; must never be browser-reachable.
  DRIVE_INTERNAL_BASE_URL: "http://octo-drive-{{BRANCH}}:8080"
  # Per-request timeout (ms) for the derived-access lookup: it sits on the
  # read/authorize hot path, so a hung drive service aborts fast and fails closed.
  DRIVE_DERIVED_TIMEOUT_MS: "500"
  # Short-TTL cache window (ms) for a CONFIRMED derived-access answer, per
  # (doc, uid, principal space), to bound drive QPS on hot docs. A drive-side
  # revocation takes at most this long to propagate.
  DRIVE_DERIVED_TTL_MS: "15000"
  # ─────────────────────────────────────────────────────────────
  # Note: the two internal tokens are credential-grade shared secrets. They are
  # provisioned exclusively via `octo-docs-backend-secret` (secretKeyRef in
  # manifests/deploy.yaml) — NOT here. Access to a ConfigMap needs only
  # namespace configmap-read RBAC (commonly broad), which is why every
  # credential in this backend (MYSQL_PASSWORD, COLLAB_TOKEN_SECRET,
  # OCTO_SERVER_TOKEN, ATTACHMENT_*, …) lives in the Secret, not here.
  #   • DOCS_INTERNAL_TOKEN  – inbound (drive → docs role), docs-side authoritative.
  #     Docs generates and rotates; drive syncs its docs_backend.internal_token
  #     to the same value. Compared (timing-safe) on GET /internal/docs/:docId/role
  #     (internal listener 9090). Empty ⇒ every caller rejected (fail-closed).
  #   • DRIVE_INTERNAL_TOKEN – outbound (docs → drive derived-access),
  #     drive-side authoritative. Drive generates and rotates; docs syncs.
  #     Sent as X-Internal-Token on POST <DRIVE_INTERNAL_BASE_URL>/internal/v1/docs/derived-access.
  #     Empty ⇒ docs omits the header, drive returns 401, derived viewer degrades
  #     to 'none' (fail-closed).
  # See manifests/deploy.yaml env: entries and docs/DEPLOYMENT.md §3.1.2 for the
  # secretKeyRef wiring. Never logged, never printed, never in ConfigMap.
  # ─────────────────────────────────────────────────────────────

  ATTACHMENT_BUCKET: "octo-docs-attachments"
  ATTACHMENT_DRIVER: "local-hmac"
  ATTACHMENT_KEY_PREFIX: "octo-docs/{{BRANCH}}"
  ATTACHMENT_S3_ENDPOINT: "http://localhost:9000"
  ATTACHMENT_S3_REGION: "us-east-1"
  ATTACHMENT_S3_FORCE_PATH_STYLE: "true"
  ATTACHMENT_UPLOAD_URL_TTL_SECONDS: "300"
  ATTACHMENT_READ_URL_TTL_SECONDS: "600"
  ATTACHMENT_MAX_RESOLVE_BATCH: "200"
  ATTACHMENT_MAX_IMAGE_SIZE_BYTES: "10485760"
  ATTACHMENT_MAX_FILE_SIZE_BYTES: "52428800"

  OG_FETCH_TIMEOUT_MS: "5000"
  OG_MAX_RESPONSE_BYTES: "524288"
  OG_MAX_REDIRECTS: "3"
  OG_USER_AGENT: "octo-docs-linkcard/1.0 (+bot)"
  OG_ALLOWED_PORTS: "80,443"
  OG_CACHE_SUCCESS_TTL_SECONDS: "86400"
  OG_CACHE_FAILURE_TTL_SECONDS: "300"

  MAX_DOC_BYTES: "20971520"
  SHEET_READ_MAX_CELL_BYTES: "20971520"
  SHEET_WRITE_MAX_REQUEST_BYTES: "3145728"
  SHEET_WRITE_MAX_CELLS: "20000"

  AUTO_SNAPSHOT_ENABLED: "false"
  AUTO_IDLE_MS: "15000"
  AUTO_MIN_INTERVAL_MS: "60000"
  AUTO_RETAIN_COUNT: "50"
  AUTO_RETAIN_DAYS: "7"
