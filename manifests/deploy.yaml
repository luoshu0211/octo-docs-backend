# octo-docs-backend K8s manifest.
# GitLab CI renders this file, pushes it to deploy-files, and ArgoCD syncs it.
#
# Placeholders:
#   {{REPO_URL}}      image repository without tag or digest
#   {{IMAGE_DIGEST}}  immutable image digest from the package job
#   {{BRANCH}}        dev / test / prod
#
# ConfigMap and Secret are intentionally not included in ArgoCD sync. The
# Deployment references them so missing runtime config fails loudly.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: octo-docs-backend-{{BRANCH}}
  labels:
    app: octo-docs-backend
    app.kubernetes.io/name: octo-docs-backend
    app.kubernetes.io/part-of: octo-docs
    octo.docs/env: "{{BRANCH}}"
spec:
  # The process serves HTTP API + PPT WS on 3000 and Hocuspocus Yjs WS on 1234.
  # PPT uses its ordered MySQL log and Redis notifications. Cross-node Yjs
  # state is carried by the Redis extension mounted unconditionally in
  # src/collab/server.ts, so a document opened on two pods stays one logical
  # doc: a two-instance run verified the concurrent baseVersion guard (exactly
  # one writer wins, the other gets 412) and cold-start catch-up (a peer that
  # never loaded the doc still receives edits that are only in the other pod's
  # memory, with the DB row still empty) for all three doc types — doc, sheet
  # and board. documentName-affinity routing is therefore not a prerequisite;
  # the Service stays on default round-robin.
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: octo-docs-backend
      octo.docs/env: "{{BRANCH}}"
  # Recreate tears every pod down before starting the new ones, which makes
  # each rollout a full outage — acceptable at one replica, but it throws away
  # the availability the second replica exists for. maxUnavailable: 0 keeps at
  # least one pod serving throughout; maxSurge: 1 bounds the extra pod so the
  # rollout never doubles the DB/Redis connection footprint.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: octo-docs-backend
        app.kubernetes.io/name: octo-docs-backend
        app.kubernetes.io/part-of: octo-docs
        octo.docs/env: "{{BRANCH}}"
    spec:
      imagePullSecrets:
        - name: tcr-image-xtiao
      terminationGracePeriodSeconds: 30
      containers:
        - name: octo-docs-backend
          image: "{{REPO_URL}}@{{IMAGE_DIGEST}}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
            - name: hocuspocus
              containerPort: 1234
            # Internal-only service-to-service surface (INTERNAL_HTTP_PORT), serves
            # only /internal/html. Must NEVER be added to an Ingress or nginx
            # upstream; only reachable via the ClusterIP Service below for
            # in-cluster callers (e.g. the html service). See docs/DEPLOYMENT.md.
            - name: internal
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: octo-docs-backend-config-{{BRANCH}}
          env:
            - name: NODE_ENV
              value: "production"
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: HTTP_PORT
              value: "3000"
            - name: HOCUSPOCUS_PORT
              value: "1234"
            - name: INTERNAL_HTTP_PORT
              value: "9090"
            - name: REDIS_PREFIX
              value: "octo-docs-{{BRANCH}}"
            - name: NODE_OPTIONS
              value: "--max-old-space-size=1536"
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: octo-docs-backend-secret
                  key: MYSQL_PASSWORD
            - name: COLLAB_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: octo-docs-backend-secret
                  key: COLLAB_TOKEN_SECRET
            - name: OCTO_SERVER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: octo-docs-backend-secret
                  key: OCTO_SERVER_TOKEN
                  optional: true
            - name: ATTACHMENT_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: octo-docs-backend-secret
                  key: ATTACHMENT_SIGNING_SECRET
            - name: ATTACHMENT_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: octo-docs-backend-secret
                  key: ATTACHMENT_S3_ACCESS_KEY
                  optional: true
            - name: ATTACHMENT_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: octo-docs-backend-secret
                  key: ATTACHMENT_S3_SECRET_KEY
                  optional: true
            # TES-149/TES-150 drive↔docs internal tokens. Two independent
            # shared secrets, one per direction; each authoritative on the
            # side that generates it. Credential-grade → Secret (never
            # ConfigMap). See docs/DEPLOYMENT.md §3.1.2.
            # Inbound (drive → docs role, GET /internal/docs/:docId/role):
            # docs-side authoritative; drive syncs docs_backend.internal_token.
            # Empty ⇒ inbound endpoint rejects every caller (fail-closed).
            - name: DOCS_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: octo-docs-backend-secret
                  key: DOCS_INTERNAL_TOKEN
                  optional: true
            # Outbound (docs → drive derived-access, X-Internal-Token):
            # drive-side authoritative; must equal drive top-level internal_token.
            # Empty ⇒ docs omits the header; drive 401 ⇒ derived viewer 'none'.
            - name: DRIVE_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: octo-docs-backend-secret
                  key: DRIVE_INTERNAL_TOKEN
                  optional: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 2Gi

---
apiVersion: v1
kind: Service
metadata:
  name: octo-docs-backend-{{BRANCH}}
  labels:
    app: octo-docs-backend
    app.kubernetes.io/name: octo-docs-backend
    app.kubernetes.io/part-of: octo-docs
    octo.docs/env: "{{BRANCH}}"
spec:
  type: ClusterIP
  selector:
    app: octo-docs-backend
    octo.docs/env: "{{BRANCH}}"
  ports:
    - name: http
      port: 3000
      targetPort: 3000
    - name: hocuspocus
      port: 1234
      targetPort: 1234
    # ClusterIP-only; not fronted by any Ingress/nginx rule. Reachable in-cluster
    # (e.g. by the html Service) as octo-docs-backend-{{BRANCH}}:9090.
    - name: internal
      port: 9090
      targetPort: 9090
