---
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "test"'
    - if: '$CI_COMMIT_TAG'

stages:
  - build
  - package
  - sync
  - deploy
  - notify

variables:
  APP_NAME: octo-docs-backend
  REPOSITORY: tbj7-xtiao-tcr1.tencentcloudcr.com
  CONTAINER_IMAGE: tbj7-xtiao-tcr1.tencentcloudcr.com/dmwork/octo-docs-backend
  DEPLOY_FILES_REPO: code.mlamp.cn/dm-fa/infra/deploy-files.git
  FF_USE_FASTZIP: "true"
  ROBOT_PUSH_MESSAGE: "enable"

  NODE_IMAGE: tbj7-xtiao-tcr1.tencentcloudcr.com/xtiao-release/node:22-alpine
  DOCKER_IMAGE: tbj7-xtiao-tcr1.tencentcloudcr.com/xtiao-release/docker:20.10.17
  GIT_IMAGE: tbj7-xtiao-tcr1.tencentcloudcr.com/xtiao-release/alpine/git:v2.30.2
  CURL_IMAGE: tbj7-xtiao-tcr1.tencentcloudcr.com/xtiao-release/alpine/curl:8.11.1
  NPM_REGISTRY: https://registry.npmmirror.com
  ARGOCD_SERVER: argocd-server.argocd:80

build:
  stage: build
  only:
    - merge_requests
  tags:
    - tke-deepmining-runner
  image: $NODE_IMAGE
  before_script:
    - npm config set registry "$NPM_REGISTRY"
  script:
    - npm ci
    - npm run typecheck
    - npm test
    - npm run build

ppt_cluster_integration:
  stage: build
  tags:
    - tke-deepmining-runner
  image: $NODE_IMAGE
  services:
    - name: mysql:8.0
      alias: mysql
      command: ["--max-allowed-packet=67108864"]
    - name: redis:7-alpine
      alias: redis
  variables:
    # Disposable CI service credentials, never production credentials.
    MYSQL_HOST: mysql
    MYSQL_PORT: "3306"
    MYSQL_DATABASE: ppt_case_test_cluster
    MYSQL_USER: ppt_ci
    MYSQL_PASSWORD: ppt-ci-only
    MYSQL_ROOT_PASSWORD: ppt-ci-root-only
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    REDIS_PREFIX: ppt-ci-cluster
    PPT_CANONICAL_MYSQL_TEST: "1"
    PPT_CLUSTER_MYSQL_TEST: "1"
  before_script:
    - npm config set registry "$NPM_REGISTRY"
  script:
    - npm ci
    - node scripts/waitForPptTestServices.mjs
    - npm test -- test/pptCanonicalId.mysql.test.ts

.package: &package
  stage: package
  tags:
    - tke-deepmining-runner
  image: $DOCKER_IMAGE
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - i=0; while [ "$i" -lt 12 ]; do docker info && break; sleep 5; i=$(( i + 1 )) ; done
    - echo "$HARBOR_PWD" | docker login "$REPOSITORY" -u 100028731872 --password-stdin
  script:
    - |
      set -e
      BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
      docker build \
        -t "${PUSH_IMAGE_PATH}" \
        -t "${PUSH_IMAGE_LATEST}" \
        --build-arg NODE_IMAGE="${NODE_IMAGE}" \
        --build-arg NPM_REGISTRY="${NPM_REGISTRY}" \
        --build-arg GITLAB_TOKEN="${CI_JOB_TOKEN}" \
        --build-arg GIT_COMMIT="${CI_COMMIT_SHORT_SHA}" \
        --build-arg GIT_BRANCH="${CI_COMMIT_REF_NAME}" \
        --build-arg GIT_TAG="${CI_COMMIT_TAG}" \
        --build-arg BUILD_DATE="${BUILD_DATE}" \
        -f ./Dockerfile.ci .
      docker push "${PUSH_IMAGE_PATH}"
      docker push "${PUSH_IMAGE_LATEST}"
      IMAGE_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${PUSH_IMAGE_PATH}" | cut -d@ -f2)
      if [ -z "$IMAGE_DIGEST" ]; then
        echo "ERROR resolve image digest failed"
        exit 1
      fi
      echo "IMAGE_DIGEST=${IMAGE_DIGEST}" | tee package.env
      echo "packaged ${PUSH_IMAGE_PATH} @ ${IMAGE_DIGEST}"
  artifacts:
    reports:
      dotenv: package.env

package_dev:
  <<: *package
  only:
    - develop
  variables:
    PUSH_IMAGE_PATH: $CONTAINER_IMAGE:dev-$CI_PIPELINE_ID
    PUSH_IMAGE_LATEST: "$CONTAINER_IMAGE:dev-latest"

package_test:
  <<: *package
  only:
    - test
  variables:
    PUSH_IMAGE_PATH: $CONTAINER_IMAGE:test-$CI_PIPELINE_ID
    PUSH_IMAGE_LATEST: "$CONTAINER_IMAGE:test-latest"

package_tags:
  <<: *package
  only:
    - tags
  variables:
    PUSH_IMAGE_PATH: $CONTAINER_IMAGE:$CI_COMMIT_TAG
    PUSH_IMAGE_LATEST: "$CONTAINER_IMAGE:latest"

sync_code:
  stage: sync
  only:
    - develop
    - test
    - tags
  tags:
    - tke-deepmining-runner
  image: $GIT_IMAGE
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 1
  script:
    - git config --global user.email "guobin.a@mininglamp.com"
    - git config --global user.name "ci"
    - |
      set -e

      if [[ -n "$CI_COMMIT_TAG" ]]; then
        DEPLOY_ENV="prod"
        IMAGE_TAG="$CI_COMMIT_TAG"
      elif [[ "$CI_COMMIT_REF_NAME" == "test" ]]; then
        DEPLOY_ENV="test"
        IMAGE_TAG="test-${CI_PIPELINE_ID}"
      else
        DEPLOY_ENV="dev"
        IMAGE_TAG="dev-${CI_PIPELINE_ID}"
      fi

      if [[ -z "$IMAGE_DIGEST" ]]; then
        echo "Error: IMAGE_DIGEST not set; refusing to render manifest"
        exit 1
      fi

      TARGET_BRANCH="$APP_NAME-$DEPLOY_ENV"
      DEPLOY_DIR="deploy-repo"
      DEPLOY_REPO_URL="https://__token__:${CODE_TOKEN}@${DEPLOY_FILES_REPO}"

      echo "Git ref: ${CI_COMMIT_TAG:-$CI_COMMIT_REF_NAME} -> Env: $DEPLOY_ENV -> Deploy branch: $TARGET_BRANCH -> Image tag: $IMAGE_TAG -> Digest: $IMAGE_DIGEST"

      if git clone -b "$TARGET_BRANCH" --depth 1 --single-branch "$DEPLOY_REPO_URL" "$DEPLOY_DIR"; then
        echo "Branch $TARGET_BRANCH exists"
      else
        echo "Branch $TARGET_BRANCH does not exist, creating it"
        git clone --depth 1 "$DEPLOY_REPO_URL" "$DEPLOY_DIR"
        cd "$DEPLOY_DIR"
        git checkout -b "$TARGET_BRANCH"
        cd ..
      fi

      if [ ! -f manifests/deploy.yaml ]; then
        echo "Error: manifests/deploy.yaml not found"
        exit 1
      fi

      mkdir -p "$DEPLOY_DIR/manifests"
      cp manifests/deploy.yaml "$DEPLOY_DIR/manifests/deploy.yaml"

      cd "$DEPLOY_DIR"

      sed -i "s|{{BRANCH}}|${DEPLOY_ENV}|g" manifests/deploy.yaml
      sed -i "s|{{REPO_URL}}|${CONTAINER_IMAGE}|g" manifests/deploy.yaml
      sed -i "s|{{IMAGE_DIGEST}}|${IMAGE_DIGEST}|g" manifests/deploy.yaml

      if grep -q "{{" manifests/deploy.yaml; then
        echo "Error: unresolved placeholder remains after render"
        grep -n "{{" manifests/deploy.yaml
        exit 1
      fi

      git add manifests/deploy.yaml

      if git diff --cached --quiet; then
        echo "No changes to commit"
        exit 0
      fi

      git commit -m "Update octo-docs-backend ${DEPLOY_ENV} to ${IMAGE_TAG} (@${IMAGE_DIGEST})"
      git push --force "$DEPLOY_REPO_URL" "HEAD:$TARGET_BRANCH"

argocd_sync:
  stage: deploy
  only:
    - develop
    - test
    - tags
  tags:
    - tke-deepmining-runner
  image: $CURL_IMAGE
  variables:
    GIT_STRATEGY: none
  script: |
    set -e

    if [[ -n "$CI_COMMIT_TAG" ]]; then
      echo "Tag build: skipping auto ArgoCD sync for prod"
      exit 0
    elif [[ "$CI_COMMIT_REF_NAME" == "test" ]]; then
      ARGOCD_APP="octo-docs-backend-test"
    else
      ARGOCD_APP="octo-docs-backend-dev"
    fi

    echo "Syncing ArgoCD app: $ARGOCD_APP"
    SYNC_RESP=$(curl -s -w "\n%{http_code}" -X POST \
      "http://$ARGOCD_SERVER/api/v1/applications/$ARGOCD_APP/sync" \
      -H "Authorization: Bearer $ARGOCD_TOKEN" \
      -H "Content-Type: application/json" \
      -d '{"prune":false,"dryRun":false}')
    HTTP_CODE=$(echo "$SYNC_RESP" | tail -1)
    echo "Sync HTTP status: $HTTP_CODE"

    if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "204" ]; then
      echo "ArgoCD sync failed with HTTP $HTTP_CODE"
      echo "$SYNC_RESP" | head -5
      exit 1
    fi
    echo "ArgoCD sync triggered for $ARGOCD_APP"

notify_success:
  stage: notify
  only:
    - develop
    - test
    - tags
  when: on_success
  tags:
    - tke-deepmining-runner
  image: $CURL_IMAGE
  variables:
    GIT_STRATEGY: none
  script: |
    if [[ "$ROBOT_PUSH_MESSAGE" == "disable" ]]; then exit 0; fi
    if [[ -n "$CI_COMMIT_TAG" ]]; then
      ENV_LABEL="prod"
      IMAGE_TAG="$CONTAINER_IMAGE:$CI_COMMIT_TAG"
    elif [[ "$CI_COMMIT_REF_NAME" == "test" ]]; then
      ENV_LABEL="test"
      IMAGE_TAG="$CONTAINER_IMAGE:test-$CI_PIPELINE_ID"
    else
      ENV_LABEL="dev"
      IMAGE_TAG="$CONTAINER_IMAGE:dev-$CI_PIPELINE_ID"
    fi
    MESSAGE="octo-docs-backend ${ENV_LABEL} pipeline success\nref: ${CI_COMMIT_TAG:-$CI_COMMIT_REF_NAME}\ncommit: ${CI_COMMIT_SHORT_SHA}\nimage: ${IMAGE_TAG}\npipeline: ${CI_PIPELINE_URL}"
    if [[ -n "$DISCORD_WEBHOOK" ]]; then
      curl -s -X POST "$DISCORD_WEBHOOK" -H "Content-Type: application/json" -H "Authorization: Bearer $DISCORD_AUTH_TOKEN" -d "{\"content\":\"$MESSAGE\"}"
    fi
    if [[ -n "$WECOM_WEBHOOK" ]]; then
      curl -s -X POST "$WECOM_WEBHOOK" -H "Content-Type: application/json" -d "{\"msgtype\":\"text\",\"text\":{\"content\":\"$MESSAGE\"}}"
    fi

notify_failure:
  stage: notify
  only:
    - develop
    - test
    - tags
  when: on_failure
  tags:
    - tke-deepmining-runner
  image: $CURL_IMAGE
  variables:
    GIT_STRATEGY: none
  script: |
    if [[ "$ROBOT_PUSH_MESSAGE" == "disable" ]]; then exit 0; fi
    MESSAGE="octo-docs-backend pipeline failed\nref: ${CI_COMMIT_TAG:-$CI_COMMIT_REF_NAME}\ncommit: ${CI_COMMIT_SHORT_SHA}\npipeline: ${CI_PIPELINE_URL}"
    if [[ -n "$DISCORD_WEBHOOK" ]]; then
      curl -s -X POST "$DISCORD_WEBHOOK" -H "Content-Type: application/json" -H "Authorization: Bearer $DISCORD_AUTH_TOKEN" -d "{\"content\":\"$MESSAGE\"}"
    fi
    if [[ -n "$WECOM_WEBHOOK" ]]; then
      curl -s -X POST "$WECOM_WEBHOOK" -H "Content-Type: application/json" -d "{\"msgtype\":\"text\",\"text\":{\"content\":\"$MESSAGE\"}}"
    fi
